<!doctype html>
<html>
  <head>
    <title>Float-Inspector</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Float-Inspector</h1>

    <h2>f16</h2>
    <table>
      <tr>
        <td></td>
        <th>Sign</th>
        <th>Exponent</th>
        <th>Mantissa</th>
      </tr>
      <tr>
        <th>Value</th>
        <td id="f16-s-val"></td>
        <td id="f16-e-val"></td>
        <td id="f16-m-val"></td>
      </tr>
      <tr>
        <th>Encoded as</th>
        <td id="f16-s-enc"></td>
        <td id="f16-e-enc"></td>
        <td id="f16-m-enc"></td>
      </tr>
      <tr>
        <th>Binary</th>
        <td>
          <input type="checkbox" id="f16-s0"/>
        </td>
        <td>
          <input type="checkbox" id="f16-e4"/>
          <input type="checkbox" id="f16-e3"/>
          <input type="checkbox" id="f16-e2"/>
          <input type="checkbox" id="f16-e1"/>
          <input type="checkbox" id="f16-e0"/>
        </td>
        <td>
          <input type="checkbox" id="f16-m9"/>
          <input type="checkbox" id="f16-m8"/>
          <input type="checkbox" id="f16-m7"/>
          <input type="checkbox" id="f16-m6"/>
          <input type="checkbox" id="f16-m5"/>
          <input type="checkbox" id="f16-m4"/>
          <input type="checkbox" id="f16-m3"/>
          <input type="checkbox" id="f16-m2"/>
          <input type="checkbox" id="f16-m1"/>
          <input type="checkbox" id="f16-m0"/>
        </td>
      </tr>
      <tr>
        <th>Decimal</th>
        <td colspan="3">
          <input type="text" id="f16-dec"/>
        </td>
      </tr>
      <tr>
        <th>Binary</th>
        <td colspan="3">
          <input type="text" id="f16-bin"/>
        </td>
      </tr>
      <tr>
        <th>Hexadecimal</th>
        <td colspan="3">
          <input type="text" id="f16-hex"/>
        </td>
      </tr>
    </table>
