<!doctype html>
<html>
  <head>
    <title>Float</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Float</h1>
    <table>
      <tr>
        <td></td>
        <th>Sign</th>
        <th>Exponent</th>
        <th>Mantissa</th>
      </tr>
      <tr>
        <th>Value</th>
        <td id="f32-s-val"></td>
        <td id="f32-e-val"></td>
        <td id="f32-m-val"></td>
      </tr>
      <tr>
        <th>Encoded as</th>
        <td id="f32-s-enc"></td>
        <td id="f32-e-enc"></td>
        <td id="f32-m-enc"></td>
      </tr>
      <tr>
        <th>Binary</th>
        <td>
          <input type="checkbox" id="f32-s0"/>
        </td>
        <td>
          <input type="checkbox" id="f32-e7"/>
          <input type="checkbox" id="f32-e6"/>
          <input type="checkbox" id="f32-e5"/>
          <input type="checkbox" id="f32-e4"/>
          <input type="checkbox" id="f32-e3"/>
          <input type="checkbox" id="f32-e2"/>
          <input type="checkbox" id="f32-e1"/>
          <input type="checkbox" id="f32-e0"/>
        </td>
        <td>
          <input type="checkbox" id="f32-m22"/>
          <input type="checkbox" id="f32-m21"/>
          <input type="checkbox" id="f32-m20"/>
          <input type="checkbox" id="f32-m19"/>
          <input type="checkbox" id="f32-m18"/>
          <input type="checkbox" id="f32-m17"/>
          <input type="checkbox" id="f32-m16"/>
          <input type="checkbox" id="f32-m15"/>
          <input type="checkbox" id="f32-m14"/>
          <input type="checkbox" id="f32-m13"/>
          <input type="checkbox" id="f32-m12"/>
          <input type="checkbox" id="f32-m11"/>
          <input type="checkbox" id="f32-m10"/>
          <input type="checkbox" id="f32-m9"/>
          <input type="checkbox" id="f32-m8"/>
          <input type="checkbox" id="f32-m7"/>
          <input type="checkbox" id="f32-m6"/>
          <input type="checkbox" id="f32-m5"/>
          <input type="checkbox" id="f32-m4"/>
          <input type="checkbox" id="f32-m3"/>
          <input type="checkbox" id="f32-m2"/>
          <input type="checkbox" id="f32-m1"/>
          <input type="checkbox" id="f32-m0"/>
        </td>
      </tr>
    </table>
    <table>
      <tr>
        <th>Decimal</th>
        <td>
          <input type="text" id="f32-dec"/>
        </td>
      </tr>
      <tr>
        <th>Binary</th>
        <td>
          <input type="text" id="f32-bin"/>
        </td>
      </tr>
      <tr>
        <th>Hexadecimal</th>
        <td>
          <input type="text" id="f32-hex"/>
        </td>
      </tr>
    </table>
  </body>
</html>
